name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ShowVerse Pro Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17 (Zulu JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK Platforms & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDK_CMD=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDK_CMD" ]; then
            yes | "$SDK_CMD" --licenses 2>/dev/null || true
            "$SDK_CMD" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Setup Capacitor Android Platform
        run: |
          npx cap sync android

      - name: Make Gradle Executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowVersePro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
